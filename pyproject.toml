[project]
name = "yellow-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dj-rest-auth==7.0.1",
    "django-allauth[socialaccount]==64.0.0",
    "django-cors-headers==4.7.0",
    "django-environ==0.12.0",
    "django-import-export==4.3.7",
    "django-q2==1.7.6",
    "Django==5.1.7",
    "djangorestframework-simplejwt==5.5.0",
    "djangorestframework==3.16.0",
    "drf-spectacular==0.28.0",
    "geopy>=2.4.1",
    "gunicorn==23.0.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.2.3",
    "ortools==9.15.6755",
    "pandas==2.2.3",
    "regex==2024.11.6",
    "requests==2.32.4",
    "scikit-learn==1.6.1",
    "xgboost-cpu==2.1.4",
    "whitenoise==6.9.0",
